STREAMING_CHUNK:Configuring workflow triggers...
​name: Auto Update Data and Version
​on:
schedule:
- cron: '0 0 * * *'
workflow_dispatch:
​STREAMING_CHUNK:Defining update job...
​jobs:
update-files:
runs-on: ubuntu-latest
steps:
# STREAMING_CHUNK:Checking out repository...
- name: Checkout Repository
uses: actions/checkout@v4
with:
token: ${{ secrets.PAT_TOKEN }}
​# STREAMING_CHUNK:Fetching data from peer repository...
- name: Fetch Latest Data from Peer Repository
run: |
curl -f -v -H "Authorization: token ${{ secrets.PAT_TOKEN }}" -sSL "https://raw.githubusercontent.com/saedmohamedn2210-create/qadreen-data/main/data.json" -o data.json
head -n 5 data.json
​# STREAMING_CHUNK:Updating version number...
- name: Update Version Number
run: |
if [ -f Version_data_base.txt ]; then
CURRENT_VER=تعبير حسابي
تعبير حسابي
cap N cap E cap W sub cap V cap E cap R equals((CURRENT_VER + 1))
else
NEW_VER=1
fi
else
NEW_VER=1
fi
echo "$NEW_VER" > Version_data_base.txt
echo "Version updated to: $NEW_VER"
​# STREAMING_CHUNK:Committing and pushing changes...
- name: Commit and Push Changes
run: |
git config --local user.email "github-actions[bot]@users.noreply.github.com"
git config --local user.name "github-actions[bot]"
git add data.json Version_data_base.txt
if git diff-index --quiet HEAD; then
echo "No changes detected. Skipping commit."
else
git commit -m "Auto update data.json and bump version"
git push
fi